spring.application.name=sentinelassess
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sentinelassess;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.runlet.url=${RUNLET_URL:https://runlet.codealong.live/execute}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
